<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0a0d 0%, #1a1a1e 100%);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 16px;
      font-size: 12px;
      background: #000;
      border-bottom: 1px solid rgba(230, 0, 18, 0.1);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .greeting-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid rgba(230, 0, 18, 0.1);
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #A8FF00 0%, #7FFF00 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #000;
      font-size: 14px;
      flex-shrink: 0;
    }

    .greeting-text small {
      display: block;
      font-size: 10px;
      color: #999;
      margin-bottom: 2px;
    }

    .greeting-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
    }

    .points-card {
      background: linear-gradient(135deg, #FF9500 0%, #FF6B00 100%);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(255, 107, 0, 0.3);
    }

    .points-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .points-amount {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .points-desc {
      font-size: 9px;
      opacity: 0.85;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .points-buttons {
      display: flex;
      gap: 8px;
    }

    .points-buttons button {
      flex: 1;
      padding: 6px;
      border: none;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      cursor: pointer;
    }

    .points-buttons button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .gym-card {
      background: #2a1620;
      border-radius: 12px;
      padding: 14px;
      border-left: 3px solid #E60012;
    }

    .gym-card h3 {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .gym-card p {
      font-size: 9px;
      color: #ccc;
      line-height: 1.4;
    }

    .events-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
      font-size: 12px;
    }

    .events-header strong {
      font-weight: 700;
    }

    .events-header a {
      color: #E60012;
      text-decoration: none;
      font-size: 9px;
      cursor: pointer;
    }

    .event-item {
      background: linear-gradient(135deg, #8B1538 0%, #5a0f2a 100%);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .event-item h4 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
      color: #fff;
    }

    .event-item p {
      font-size: 9px;
      color: #FF9500;
    }

    .nav-bar {
      background: #1a1a1e;
      border-top: 1px solid rgba(230, 0, 18, 0.1);
      padding: 8px 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 18px;
      height: 60px;
    }

    .nav-center {
      width: 48px;
      height: 48px;
      background: #E60012;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -24px;
      box-shadow: 0 4px 16px rgba(230, 0, 18, 0.4);
    }

    .nav-item {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone-screen">
    <div class="status-bar">
      <span>9:41</span>
      <span style="letter-spacing: 2px; font-size: 10px;">●●●●●</span>
    </div>

    <div class="content">
      <div class="greeting-card">
        <div class="avatar">SS</div>
        <div class="greeting-text">
          <small>Good Afternoon!</small>
          <strong>2OFIT Warrior</strong>
        </div>
      </div>

      <div class="points-card">
        <div class="points-label">Get Points</div>
        <div class="points-amount">0</div>
        <div class="points-desc">Redeem perks for discounts on every purchase</div>
        <div class="points-buttons">
          <button>⏰ History</button>
          <button>➕ Top Up</button>
        </div>
      </div>

      <div class="gym-card">
        <h3>Book Your Gym</h3>
        <p>Reserve your spot & secure your training time with ease.</p>
      </div>

      <div>
        <div class="events-header">
          <strong>Upcoming Events</strong>
          <a>View All</a>
        </div>
        <div class="event-item">
          <div>
            <h4>JUSTISIA</h4>
            <p>HALF MARATHON 2026</p>
          </div>
        </div>
      </div>
    </div>

    <div class="nav-bar">
      <div class="nav-item">🏠</div>
      <div class="nav-item">🧭</div>
      <div class="nav-center">❤️</div>
      <div class="nav-item">🎟️</div>
      <div class="nav-item">👤</div>
    </div>
  </div>
</body>
</html>

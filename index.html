document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n:0 auto 38px\">Download the 20fit app and keep every part of your health in one place — measured, connected, and always with you.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center\">\n        <a href=\"https://apps.apple.com/us/app/20fit-indonesia/id1475504793\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:11px;background:#0A0A0B;color:#fff;text-decoration:none;padding:14px 24px;border-radius:9px;transition:transform .2s,box-shadow .2s\" style-hover=\"transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.35)\">\n          <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M16.5 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.8-3.5.8s-1.8-.8-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.7 2.3s1.5-.7 2.8-.7 1.7.7 2.8.7 1.9-1.1 2.6-2.2c.8-1.2 1.2-2.4 1.2-2.5-.1 0-2.3-.9-2.3-3.6zM14.3 5.3c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.2z\"><\u002Fpath><\u002Fsvg>\n          <span style=\"text-align:left\"><span style=\"display:block;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:#9a9a9e\">DOWNLOAD ON THE<\u002Fspan><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;line-height:1.05;white-space:nowrap\">App Store<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://play.google.com/store/apps/details?id=com.twentyfit.indonesia&amp;hl=en\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:11px;background:#0A0A0B;color:#fff;text-decoration:none;padding:14px 24px;border-radius:9px;transition:transform .2s,box-shadow .2s\" style-hover=\"transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.35)\">\n          <svg width=\"22\" height=\"24\" viewBox=\"0 0 24 24\"><path d=\"M3.6 1.8L13.8 12L3.6 12Z\" fill=\"#00D2FF\"><\u002Fpath><path d=\"M3.6 12L13.8 12L3.6 22.2Z\" fill=\"#00DE6E\"><\u002Fpath><path d=\"M3.6 1.8L20.4 12L13.8 12Z\" fill=\"#FF3D00\"><\u002Fpath><path d=\"M3.6 22.2L20.4 12L13.8 12Z\" fill=\"#FFCE00\"><\u002Fpath><\u002Fsvg>\n          <span style=\"text-align:left\"><span style=\"display:block;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:#9a9a9e\">GET IT ON<\u002Fspan><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;line-height:1.05;white-space:nowrap\">Google Play<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== FOOTER ===== -->\n  <footer style=\"background:#0A0A0B;padding:clamp(36px,5vw,56px) clamp(20px,5vw,64px);border-top:1px solid rgba(255,255,255,.08)\">\n    <div style=\"max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px\">\n      <div style=\"display:flex;align-items:center\">\n        <img src=\"https://media.20fit.id/wp-content/uploads/2026/05/Untitled-design-1.png\" alt=\"20FIT\" style=\"height:32px;width:auto;display:block;object-fit:contain\" onerror=\"this.style.display='none';this.nextElementSibling.style.display='inline-flex'\">\n        <span style=\"display:none;align-items:baseline;gap:2px\"><span style=\"font-family:'Anton',sans-serif;font-size:24px;color:#fff\">20FIT<\u002Fspan><span style=\"width:7px;height:7px;border-radius:50%;background:#E60012;align-self:center;margin-left:4px\"><\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;color:#6b6b6e\">ALL YOUR HEALTH · ONE SYSTEM<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;color:#6b6b6e\">© {{ year }} 20FIT<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { screen: 'home' };\n\n  renderVals() {\n    const s = this.state.screen || 'home';\n    const go = (k) => () => this.setState({ screen: k });\n    const tab = (k) => \"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:9px 17px;border-radius:100px;cursor:pointer;transition:all .2s;white-space:nowrap;border:1px solid \" + (s === k ? '#E60012' : 'rgba(255,255,255,.14)') + ';background:' + (s === k ? '#E60012' : 'transparent') + ';color:' + (s === k ? '#fff' : '#9a9a9e');\n    const ac = (k) => (s === k ? '#E60012' : '#6B6B70');\n    const I = {\n      bolt: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/><\u002Fsvg>',\n      ruler: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8l13 13 5-5L8 3z\"/><path d=\"M7 7l2 2M11 5l2 2M14 11l2 2M10 14l2 2\"/><\u002Fsvg>',\n      heart: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12h4l2-5 3 9 2-6 1.5 2H22\"/><\u002Fsvg>',\n      flame: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2s5 4 5 9a5 5 0 0 1-10 0c0-1.5.8-2.8.8-2.8C7 10 9 8 9 5c2 1 3 3 3 3 1-2 0-6 0-6z\"/><\u002Fsvg>',\n      cal: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"/><path d=\"M3 9h18M8 2v4M16 2v4\"/><\u002Fsvg>',\n      chart: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18\"/><path d=\"M6 17V9M11 17V5M16 17v-6M21 17V8\"/><\u002Fsvg>',\n      medical: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"3\" width=\"16\" height=\"19\" rx=\"2\"/><path d=\"M9 3h6v3H9z\"/><path d=\"M12 11v6M9 14h6\"/><\u002Fsvg>'\n    };\n    return {\n      year: new Date().getFullYear(),\n      features: [\n        { no: '01', icon: I.cal,     title: 'Book Workout Sessions', desc: 'Reserve, reschedule and check in to your EMS sessions in just a few taps.' },\n        { no: '02', icon: I.heart,   title: 'Wellness', desc: 'Recovery, sleep and overall wellness insights tracked alongside your training.' },\n        { no: '03', icon: I.cal,     title: 'Personal Training Booking', desc: 'Book one-on-one sessions with your trainer in just a few taps.' },\n        { no: '04', icon: I.medical, title: 'Doctors Consultation', desc: 'Consult with doctors and keep every health record inside the app.' },\n        { no: '05', icon: I.chart,   title: 'Progress & Goals', desc: 'Visual trends and milestones that show exactly how far you have come.' },\n        { no: '06', icon: I.medical, title: 'Medical Check-Up', desc: 'Health screenings and check-up records kept safely inside your profile.' }\n      ],\n      steps: [\n        { no: '1', title: 'Book your session', desc: 'Pick a time slot at your studio straight from the app — no calls, no waiting.' },\n        { no: '2', title: 'Train with EMS', desc: 'Your 20-minute session, heart rate and intensity are captured as you move.' },\n        { no: '3', title: 'Track everything', desc: 'Results sync instantly so every metric lives together in one clear dashboard.' }\n      ],\n      screen: s,\n      isHome: s === 'home', isBook: s === 'book', isProgress: s === 'progress', isRewards: s === 'rewards',\n      cHome: ac('home'), cBook: ac('book'), cProg: ac('progress'), cRew: ac('rewards'),\n      tabs: [\n        { label: 'Home', onClick: go('home'), style: tab('home') },\n        { label: 'Book', onClick: go('book'), style: tab('book') },\n        { label: 'Progress', onClick: go('progress'), style: tab('progress') },\n        { label: 'Rewards', onClick: go('rewards'), style: tab('rewards') }\n      ]\n    };\n  }\n\n  componentDidMount() {\n    const setup = () => {\n      const els = document.querySelectorAll('[data-reveal]');\n      if (!els.length) { setTimeout(setup, 120); return; }\n      // grid cells: subtle staggered reveal, but always end visible\n      document.querySelectorAll('[data-grid]').forEach((grid) => {\n        const cells = grid.querySelectorAll('[data-cell]');\n        cells.forEach((cell, i) => {\n          cell.style.transition = 'opacity .6s cubic-bezier(.16,1,.3,1) ' + (i * 0.06) + 's, transform .6s cubic-bezier(.16,1,.3,1) ' + (i * 0.06) + 's, background .35s, border-color .35s';\n          cell.style.opacity = '0';\n          cell.style.transform = 'translateY(18px)';\n        });\n        const showCells = () => cells.forEach((cell) => { cell.style.opacity = '1'; cell.style.transform = 'translateY(0)'; });\n        const r = grid.getBoundingClientRect();\n        const vh = window.innerHeight || document.documentElement.clientHeight;\n        if (r.top < vh * 0.92) { showCells(); }\n        grid.__show = showCells;\n      });\n      const all = () => document.querySelectorAll('[data-reveal]');\n      const check = () => {\n        const vh = window.innerHeight || document.documentElement.clientHeight;\n        all().forEach((el) => {\n          if (el.getAttribute('data-shown')) { return; }\n          const r = el.getBoundingClientRect();\n          if (r.top < vh * 0.9 && r.bottom > 0) {\n            el.setAttribute('data-shown', '1');\n            el.style.opacity = '1';\n            el.style.transform = 'translateY(0)';\n          }\n        });\n        document.querySelectorAll('[data-grid]').forEach((grid) => {\n          if (grid.__shown || !grid.__show) { return; }\n          const r = grid.getBoundingClientRect();\n          if (r.top < vh * 0.9 && r.bottom > 0) { grid.__shown = 1; grid.__show(); }\n        });\n      };\n      check();\n      window.addEventListener('scroll', check, { passive: true, capture: true });\n      window.addEventListener('resize', check, { passive: true });\n      // safety: reveal everything shortly after load regardless\n      [200, 600, 1500].forEach((t) => setTimeout(check, t));\n      setTimeout(() => {\n        all().forEach((el) => {\n          if (!el.getAttribute('data-shown')) {\n            el.style.transition = 'none';\n            el.style.opacity = '1';\n            el.style.transform = 'translateY(0)';\n          }\n        });\n        document.querySelectorAll('[data-cell]').forEach((cell) => {\n          if (getComputedStyle(cell).opacity !== '1') { cell.style.transition = 'none'; cell.style.opacity = '1'; cell.style.transform = 'translateY(0)'; }\n        });\n      }, 1600);\n    };\n    setup();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
